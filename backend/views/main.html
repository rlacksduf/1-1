<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하치와레의 사용자 관리</title>
    <style>
        /* 1. 기본 배경 (하치와레 풍의 맑은 하늘색 톤) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #ebf5ff; /* 맑고 부드러운 하늘색 바탕 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. 하치와레 카드 컨테이너 */
        .hachi-card {
            background-color: #ffffff; /* 하치와레의 하얗고 하얀 몸통 */
            border: 4px solid #a2d2ff; /* 하치와레 블루 테두리 */
            border-radius: 32px;
            padding: 45px 35px 35px 35px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 12px 24px rgba(162, 210, 255, 0.2);
            position: relative; /* 귀 배치를 위한 기준점 */
            margin-top: 20px;
        }

        /* 3. ★ 핵심: 하치와레의 파란색 귀(가르마) 구현 */
        .hachi-card::before, .hachi-card::after {
            content: '';
            position: absolute;
            top: -18px;
            width: 45px;
            height: 45px;
            background-color: #a2d2ff; /* 하치와레 블루 */
            border: 4px solid #a2d2ff;
        }
        /* 왼쪽 귀 */
        .hachi-card::before {
            left: 50px;
            border-radius: 40px 40px 0px 40px;
            transform: rotate(-10deg);
        }
        /* 오른쪽 귀 */
        .hachi-card::after {
            right: 50px;
            border-radius: 40px 40px 40px 0px;
            transform: rotate(10deg);
        }

        /* 4. 텍스트 스타일링 */
        .main-title {
            color: #7094b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15rem;
            margin-bottom: 6px;
        }
        .users-title {
            color: #2a4365; /* 짙은 네이비 톤 */
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 25px;
        }
        /* 말버릇이나 아이콘 슬쩍 넣기 */
        .users-title::after {
            content: ' 🐱✨'; 
            font-size: 1.8rem;
        }

        /* 5. "어떻게든 되겠지!" 당찬 느낌의 버튼 */
        .hachi-btn {
            display: inline-block;
            width: 100%;
            background-color: #a2d2ff; /* 하치와레 블루 */
            color: #ffffff;
            padding: 16px 20px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.05rem;
            border: 3px solid #7094b8; /* 만화 같은 느낌의 진한 테두리 */
            box-shadow: 0 6px 0px #7094b8; /* 입체감 넘치는 초콜릿 같은 그림자 */
            transition: all 0.1s ease;
        }

        /* 호버 & 클릭 피드백 (용기 있게 꾹 누르는 느낌) */
        .hachi-btn:hover {
            background-color: #bde0fe; /* 살짝 밝아짐 */
        }
        .hachi-btn:active {
            box-shadow: 0 2px 0px #7094b8;
            transform: translateY(4px); /* 버튼이 진짜 눌리는 효과 */
        }

        /* 하단에 하치와레의 긍정 한마디 데코레이션 */
        .quote {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #a0aec0;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="hachi-card">
        <h2 class="main-title">Main</h2>
        <h2 class="users-title">Users</h2>
        {%for user in users %}
            {{user.id}} {{user.email}} {{user.name}}
        {% endfor %}
        <a href="/bb" class="hachi-btn">입력 · 수정 · 삭제하러 가기!</a>
    </div>

</body>
</html>
