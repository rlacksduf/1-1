<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Guides&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>;
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>;

    <style>
        * {
            font-family: "Playwrite NZ Guides", cursive;
            font-weight: 400;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }
    </style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header {
            margin: 0 auto;
            padding: 15px 25px;
            width: 1000px;
            background-color: rgb(200, 250, 200);
            display: flex;
            justify-content: space-between;
            /* display  flex 주면 가로로 안에 요소도ㅡㄹ ㅇ나옴 justify-content는 center space-between left right / flex를 써야 justify-content: space-between; 가능 display 종류 inline 세로로 block
            */
        }

        .nav>ul {
            /* nav 밑에 속한 > ul 효과 만약 div가 또있으면 .nav > div > ul   // > 없어도됨//    */
            display: flex
        }

        .nav>ul>li {
            list-style: none;
        }

        .nav>ul>li>a {
            color: black;
            padding: 30px 15px;
            text-decoration: none;
            font-size: 25px;
            line-height: 40px;
            /* 글자 높이를 40px로하면 글자ㅏㄱ 중간으로 옵니다.*/
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">
            <h1>header</h1>
        </div>
        <div class="nav">
            <ul>
                <li><a href="#">home</a></li> <!--li = list ltem-->
                <li><a href="#">about</a></li>
                <li><a href="#">service</a></li>
                <li><a href="#">contact</a></li>
            </ul>
        </div>
    </div>

    <div class="content">
        <h1>content</h1>
        <section class="main-slider">
            <div class="slider">
                <h1></h1>
                <div class="slide-item item1">
                    <h1>111111</h1>
                </div>
                <div class="slide-item item2">
                    <h1>222222</h1>
                </div>
                <div class="slide-item item3">
                    <h1>333333</h1>
                </div>
            </div>
        </section>
    </div>
    <div class="footer">
        <h1>footer</h1>
    </div>
</body>

<script>
    $(document).ready(function () {
        $('.slider').slick({
            autoplay: true, // 자동 재생
            autoplaySpeed: 3000, // 3초마다 전환
            dots: true, // 하단 네비게이션 점 표시
            arrows: true, // 좌우 화살표 표시
            infinite: true, // 무한 반복
            fade: true, // 페이드 효과 (선택사항)
            cssEase: 'linear'
        });
    });
</script>

</html>
