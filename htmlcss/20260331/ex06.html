<!DOCTYPE html>
<html lang="kor">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            background-color: rgb(200,200, 200);
        }

        button:hover {
            background-color: rgb(200,50,100);
        }
    </style>
</head>

<body>
    <h1>숫자 2개를 입력 받아 작은수에서 큰수 까지 더해서 출력하는 프로그램</h1>

    작은수:<input type="number" id="num1">
    큰수:<input type="number" id="num2">
    <button id="check">출력</button>
    <div id="print"></div>

</body>

<script>
    document.getElementById('check').onclick = () => {

    const n1 = parseInt(document.getElementById('num1').value);
    const n2 = parseInt(document.getElementById('num2').value);

    if (isNaN(n1) || isNaN(n2)) {
        document.getElementById('print').textContent = '두 숫자 모두 입력해주세요.';
        return;
    }


    const start = Math.min(n1, n2);
    const end = Math.max(n1, n2);

   
    let sum = 0;
    let process = "";

    for (let i = start; i <= end; i++) {
        sum += i;
        process += i + (i === end ? "" : " + "); // 마지막 숫자 뒤에는 + 생략
    }

    document.getElementById('print').textContent = `${process} = ${sum}`;
}
</script>

</html>
